<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ORION</title>

    <style>
        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           PAGE
        ========================= */

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #050505;
            color: white;
            font-family: Arial, Helvetica, sans-serif;

            overflow: hidden;
        }


        /* =========================
           NAVIGATION
        ========================= */

        header {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            padding: 30px 45px;

            display: flex;
            justify-content: flex-end;
            align-items: center;

            z-index: 10;
        }

        nav {
            display: flex;
            gap: 35px;
        }

        nav a {
            color: white;

            text-decoration: none;

            font-size: 13px;
            letter-spacing: 2px;

            transition: opacity 0.3s ease;
        }

        nav a:hover {
            opacity: 0.45;
        }


        /* =========================
           PAGE PRINCIPALE
        ========================= */

        .hero {
         width: 100%;
          height: 100vh;

         display: flex;
         flex-direction: column;

         justify-content: center;
         align-items: center;

         text-align: center;

        padding-top: 70px;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {
            display: flex;

            justify-content: center;
            align-items: center;
        }

        .logo img {
          width: min(560px, 75vw);
         max-height: 60vh;
         height: auto;

         display: block;
          object-fit: contain;
         }

        /* =========================
           BOUTON
        ========================= */

        .button {
            margin-top: 35px;

            padding: 15px 42px;

            border: 1px solid white;

            color: white;

            text-decoration: none;

            font-size: 12px;
            letter-spacing: 3px;

            transition:
                background 0.3s ease,
                color 0.3s ease,
                transform 0.3s ease;
        }

        .button:hover {
            background: white;
            color: black;

            transform: scale(1.05);
        }


        /* =========================
           PETITE ANIMATION
        ========================= */

        .hero {
            animation: appear 1.2s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.97);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }


        /* =========================
           TELEPHONE
        ========================= */

        @media (max-width: 700px) {

            header {
                padding: 22px 20px;
            }

            nav {
                gap: 18px;
            }

            nav a {
                font-size: 10px;
                letter-spacing: 1px;
            }

            .logo img {
                width: 85vw;
                max-width: 560px;
            }

            .button {
                margin-top: 25px;

                padding: 13px 30px;

                font-size: 10px;
            }
        }
    </style>
</head>


<body>

    <!-- =========================
         NAVIGATION
    ========================== -->

    <header>

        <nav>
            <a href="#">SHOP</a>
            <a href="#">ABOUT</a>
            <a href="#">CONTACT</a>
        </nav>

    </header>


    <!-- =========================
         ACCUEIL
    ========================== -->

    <main class="hero">

        <div class="logo">
            <img src="images/logo.jpg" alt="ORION">
        </div>

        <a href="shop.html" class="button">
            SHOP NOW
        </a>

    </main>

</body>
</html>
